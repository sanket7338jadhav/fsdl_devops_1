<!-- 2. Design a reusable Skill Bar Component that accepts skill name and proficiency percentage as 
input and visually represents it.  -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Bar Component</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Skill Bar Component</h1>

    <!-- Input Section -->
    <div class="input-box">
        <input type="text" id="skillName" placeholder="Enter Skill Name">
        <input type="number" id="skillPercent" placeholder="Enter Percentage (0-100)">
        <button onclick="addSkill()">Add Skill</button>
    </div>

    <!-- Skill Container -->
    <div id="skillsContainer"></div>

    <script src="script.js"></script>

</body>
</html>
