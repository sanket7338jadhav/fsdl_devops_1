<!-- 8. Create a Photo Gallery with at least six images and apply hover effects such as zoom or 
overlay.  -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Photo Gallery</h1>

    <div class="gallery">

        <div class="image-box">
            <img src="https://i0.wp.com/picjumbo.com/wp-content/uploads/beautiful-fall-nature-scenery-free-image.jpeg?w=2210&quality=70">
            <div class="overlay">Image 1</div>
        </div>

        <div class="image-box">
            <img src=" photogrid.photocollagemaker.photoeditor.squarepic_202257133830968.png">
            <div class="overlay">Image 2</div>
        </div>

        <div class="image-box">
            <img src="https://picsum.photos/300?random=3">
            <div class="overlay">Image 3</div>
        </div>

        <div class="image-box">
            <img src="https://picsum.photos/300?random=4">
            <div class="overlay">Image 4</div>
        </div>

        <div class="image-box">
            <img src="https://picsum.photos/300?random=5">
            <div class="overlay">Image 5</div>
        </div>

        <div class="image-box">
            <img src="https://picsum.photos/300?random=6">
            <div class="overlay">Image 6</div>
        </div>

    </div>

</body>
</html>
