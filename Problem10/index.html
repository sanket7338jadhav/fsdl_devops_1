<!-- 10. Develop an FAQ Accordion where clicking a question expands/collapses the answer section. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ Accordion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>FAQ Accordion</h1>

    <div class="accordion">

        <div class="item">
            <div class="question">What is HTML?</div>
            <div class="answer">HTML is the standard markup language used to create web pages.</div>
        </div>

        <div class="item">
            <div class="question">What is CSS?</div>
            <div class="answer">CSS is used to style and design web pages.</div>
        </div>

        <div class="item">
            <div class="question">What is JavaScript?</div>
            <div class="answer">JavaScript is used to add interactivity to web pages.</div>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
