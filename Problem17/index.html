<!-- 17. Develop a Product Filtering System that filters items based on category selection.  -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Filter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>🛍 Product Filter</h1>

    <!-- Filter Buttons -->
    <div class="filters">
        <button onclick="filterProducts('all')" class="active">All</button>
        <button onclick="filterProducts('electronics')">Electronics</button>
        <button onclick="filterProducts('fashion')">Fashion</button>
        <button onclick="filterProducts('books')">Books</button>
    </div>

    <!-- Products -->
    <div id="productContainer" class="products"></div>

    <script src="script.js"></script>

</body>
</html>
