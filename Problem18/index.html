<!-- 18. Build a Notes Application where users can add and delete notes, with data stored using 
localStorage.  -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Notes App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>📝 Notes App</h1>

        <!-- Input -->
        <div class="input-box">
            <textarea id="noteInput" placeholder="Write your note..."></textarea>
            <button onclick="addNote()">Add Note</button>
        </div>

        <!-- Notes -->
        <div id="notesContainer"></div>

        <p id="emptyMsg">No notes yet 📌</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
