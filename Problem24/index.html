<!-- 24. Build an Image Gallery with Category Filtering using HTML, CSS, and JavaScript.  -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 class="title">Image Gallery</h1>

    <!-- Filter Buttons -->
    <div class="buttons">
        <button onclick="filterSelection('all')">All</button>
        <button onclick="filterSelection('nature')">Nature</button>
        <button onclick="filterSelection('animals')">Animals</button>
        <button onclick="filterSelection('tech')">Technology</button>
    </div>

    <!-- Gallery -->
    <div class="gallery">

        <div class="image-box nature">
            <img src="https://picsum.photos/300?random=1">
        </div>

        <div class="image-box animals">
            <img src="https://picsum.photos/300?random=2">
        </div>

        <div class="image-box tech">
            <img src="https://picsum.photos/300?random=3">
        </div>

        <div class="image-box nature">
            <img src="https://picsum.photos/300?random=4">
        </div>

        <div class="image-box animals">
            <img src="https://picsum.photos/300?random=5">
        </div>

        <div class="image-box tech">
            <img src="https://picsum.photos/300?random=6">
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
